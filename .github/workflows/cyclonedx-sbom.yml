name: Generate CycloneDX SBOM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM from package.xml files
        run: python3 .github/scripts/generate_cyclonedx_sbom.py > sbom.cdx.json

      - name: Show SBOM (debug)
        run: cat sbom.cdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.cdx.json