# Camera parameters

/**:
  ros__parameters:

    #  The tf frame under which the images/point clouds are published
    camera_frame: pylon_camera

    #  The DeviceUserID of the camera. If empty, the first camera found in the
    #  device list will be used
    device_user_id: "my_stereo_ace"

    #  The desired publisher frame rate if listening to the topics.
    #  This parameter can only be set once at startup
    #  Calling the GrabImages-Action can result in a higher framerate
    frame_rate: 10.0

    ##########################################################################
    ######################## Image Intensity Settings ########################
    ##########################################################################
    # The following settings do *NOT* have to be set. Each camera has default
    # values which provide an automatic image adjustment resulting in valid
    # images
    ##########################################################################

    #  The exposure time in microseconds to be set after opening the camera.
    # exposure: 10000.0

    ##########################################################################

    # Grab timeout — the Stereo ace needs at least 5000 ms to deliver its
    # first stereo-processed frame
    grab_timeout: 5000

    ##########################################################################
    ###################### Stereo ace-specific settings #####################
    ##########################################################################

    # Illumination mode for the Stereo ace IR projector.
    # Controls the trade-off between depth quality and clean intensity images:
    #   AlwaysActive (default)    - projector always on; Basler-recommended for depth quality;
    #                               IR dot pattern visible in intensity images.
    #   AlternateActive           - alternates exposures with/without projector;
    #                               intensity images are free of the IR dot pattern.
    #   (Measured: no ROS output-rate difference between modes; pipeline capped ~2 Hz host-side.)
    #   Off                       - projector disabled; passive stereo, no IR.
    stereo_ace_illumination_mode: "AlwaysActive"
